<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мир Танков · KIENKO_9</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0a0f1a;
    }

    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      z-index: 0;
      object-fit: cover;
      display: none;
    }

    #bg-video.active { display: block; }

    .overlay-dark {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1;
      display: none;
    }

    .overlay-dark.active { display: block; }

    .site-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wot-title {
      font-size: clamp(2.8rem, 10vw, 5rem);
      font-weight: 900;
      text-transform: uppercase;
      background: linear-gradient(180deg, #f5e7c6 0%, #c9a45b 50%, #8b6914 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 5px;
    }

    .wot-subtitle {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 800;
      color: #e0d7b0;
      letter-spacing: 8px;
      background: rgba(0,0,0,0.55);
      display: inline-block;
      padding: 0.3rem 2.2rem;
      border-radius: 6px;
      margin-bottom: 30px;
    }

    .play-button {
      background: radial-gradient(circle at 30% 30%, #e6b422, #b87c0a);
      border: none;
      color: #0a0a0a;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 8px;
      padding: 20px 70px;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 10px 0 #5c3a04, 0 15px 30px rgba(0,0,0,0.6);
      transition: all 0.08s ease;
      margin: 20px 0;
      z-index: 20;
    }

    .play-button:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #3b2502;
    }

    .image-wrapper {
      position: relative;
      display: inline-block;
      margin-top: 20px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 30px #ffaa00;
      max-width: 100%;
      z-index: 15;
    }

    .tank-image { display: block; width: 100%; height: auto; }

    .overlay-signature {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(1.4rem, 4.5vw, 2.4rem);
      font-weight: 900;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.7);
      padding: 0.3em 1.5em;
      border-radius: 40px;
      border: 2px solid rgba(255, 255, 255, 0.6);
    }

    .hidden-content { display: none; }
    .visible-content { display: flex; flex-direction: column; align-items: center; }

    footer { margin-top: 25px; color: #8b8b7a; z-index: 10; }
  </style>
</head>
<body>

  <video id="bg-video" loop playsinline>
    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" type="video/mp4">
  </video>

  <div id="overlay-dark" class="overlay-dark"></div>

  <div class="site-container">
    <h1 class="wot-title">Мир Танков</h1>
    <div class="wot-subtitle">НАША ИГРА</div>

    <button id="playButton" class="play-button">▶ ИГРАТЬ</button>

    <div id="dynamicContent" class="hidden-content">
      <div class="image-wrapper">
        <img src="https://tanki.su/static/5.141.2_85008e/common/img/og_img.png" alt="Мир Танков" class="tank-image">
        <div class="overlay-signature">KIENKO_9 Подставушник</div>
      </div>
    </div>

    <footer>© 2025 | Танковый ангар</footer>
  </div>

  <script>
    document.getElementById('playButton').addEventListener('click', function() {
      const video = document.getElementById('bg-video');
      const overlay = document.getElementById('overlay-dark');
      const content = document.getElementById('dynamicContent');
      
      video.classList.add('active');
      overlay.classList.add('active');
      video.play();
      
      content.classList.remove('hidden-content');
      content.classList.add('visible-content');
      content.scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
